name: Astra Linux development packages
on:
  workflow_dispatch:
  push:
    branches: [ci/activate-linux-smoke-20261117]
    paths: [.github/development-build-request.json]
permissions:
  contents: read
concurrency:
  group: astra-development-${{ github.ref }}
  cancel-in-progress: false
jobs:
  development:
    name: Ubuntu 26.04 and Fedora 45 DEVELOPMENT_UNQUALIFIED
    if: github.repository == 'pmjobin/astra' && github.ref == 'refs/heads/ci/activate-linux-smoke-20261117'
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 / Node.js 24
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Ubuntu 26.04 native prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++ libxml2-dev libzstd-dev zlib1g-dev zstd time dpkg-dev llvm-22-dev
      - name: Fresh generation and system LLVM packages (migration inputs required for full qualification)
        run: python3 -B tools/ci/development.py --build "$RUNNER_TEMP/astra-dev-build" --runtime "$RUNNER_TEMP/astra-dev-runtime"
      - name: Report development and strict-memory outcomes
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as out:
              out.write('DEVELOPMENT_UNQUALIFIED. Original LLVM 23.1.4 strict memory: NOT_PASS. No release qualification.\n\n')
              for name in ['astra-dev-runtime/result.json', 'astra-dev-runtime/deb/result.json', 'astra-dev-runtime/fedora/package/result.json']:
                  path = root / name
                  if path.exists():
                      out.write('```json\n' + json.dumps(json.loads(path.read_text()), indent=2) + '\n```\n')
          PY
      - name: Preserve bounded text observations even when a build or install fails
        if: always()
        run: python3 -B tools/ci/development_bundle.py --collect-evidence "$RUNNER_TEMP/astra-dev-runtime" --output "$RUNNER_TEMP/astra-dev-text-evidence"
      - name: Upload text observations only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 / Node.js 24
        with:
          name: development-text-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/astra-dev-text-evidence
          retention-days: 7
          if-no-files-found: error
      # New system-linked astrac binaries require a new exact owner decision.
      # This workflow currently uploads bounded text evidence only.

name: Astra Linux development packages
on:
  workflow_dispatch:
  push:
    branches: [ci/activate-linux-smoke-20261117]
    paths: [.github/development-build-request.json]
permissions:
  contents: read
concurrency:
  group: astra-development-${{ github.ref }}
  cancel-in-progress: false
jobs:
  development:
    name: Ubuntu 26.04 and Fedora 45 DEVELOPMENT_UNQUALIFIED
    if: github.repository == 'pmjobin/astra' && github.ref == 'refs/heads/ci/activate-linux-smoke-20261117'
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 / Node.js 24
        with:
          persist-credentials: false
      - name: Ubuntu 26.04 native prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++ libxml2-dev libzstd-dev zlib1g-dev zstd time dpkg-dev
      - name: Fresh generation, distro packages and independent clean installations
        run: python3 -B tools/ci/development.py --build "$RUNNER_TEMP/astra-dev-build" --runtime "$RUNNER_TEMP/astra-dev-runtime"
      - name: Report development and strict-memory outcomes
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as out:
              out.write('DEVELOPMENT_UNQUALIFIED. Original LLVM 23.1.4 strict memory: NOT_PASS. No release qualification.\n\n')
              for name in ['astra-dev-runtime/result.json', 'astra-dev-build/delivery/PACKAGES.json']:
                  path = root / name
                  if path.exists():
                      out.write('```json\n' + json.dumps(json.loads(path.read_text()), indent=2) + '\n```\n')
          PY
      - name: Preserve bounded text observations even when a build or install fails
        if: always()
        run: python3 -B tools/ci/development_bundle.py --collect-evidence "$RUNNER_TEMP/astra-dev-runtime" --output "$RUNNER_TEMP/astra-dev-text-evidence"
      - name: Upload text observations only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 / Node.js 24
        with:
          name: development-text-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/astra-dev-text-evidence
          retention-days: 7
          if-no-files-found: error
      - name: Check separate owner disposition against the reviewed source
        id: distribution
        run: python3 -B tools/ci/development_bundle.py --verify "$RUNNER_TEMP/astra-dev-build/delivery.zip" --approval .github/development-build-request.json --github-output "$GITHUB_OUTPUT"
      - name: Public installer distribution explicitly authorized by owner
        if: success() && steps.distribution.outputs.approved == 'true' && github.actor == github.repository_owner
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 / Node.js 24
        with:
          name: DEV-UNQUALIFIED-linux-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/astra-dev-build/delivery.zip
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Re-download approved binary bundle
        if: success() && steps.distribution.outputs.approved == 'true' && github.actor == github.repository_owner
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 / Node.js 24
        with:
          name: DEV-UNQUALIFIED-linux-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/astra-dev-downloaded
      - name: Verify every transferred member and raw package SHA-256
        if: success() && steps.distribution.outputs.approved == 'true' && github.actor == github.repository_owner
        run: python3 -B tools/ci/development_bundle.py --verify "$RUNNER_TEMP/astra-dev-downloaded/delivery.zip" --compare-to "$RUNNER_TEMP/astra-dev-build/delivery.zip"

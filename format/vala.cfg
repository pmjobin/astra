input_tab_size = 4
output_tab_size = 4
indent_columns = 4
indent_with_tabs = 1
code_width = 0
cmt_width = 0
cmt_reflow_mode = 0
cmt_convert_tab_to_spaces = false
sp_assign = force
sp_arith = force
sp_bool = force
sp_compare = force
sp_after_comma = force
sp_before_comma = remove
sp_inside_paren = remove
sp_inside_fparen = remove
sp_inside_sparen = remove
sp_before_sparen = force
sp_func_proto_paren = remove
sp_func_def_paren = remove
sp_fparen_brace = force
sp_sparen_brace = force
sp_paren_brace = force
nl_fdef_brace = remove
nl_if_brace = remove
nl_for_brace = remove
nl_while_brace = remove
nl_switch_brace = remove
nl_try_brace = remove
nl_catch_brace = remove
nl_class_brace = remove
nl_namespace_brace = remove
nl_property_brace = remove
nl_getset_brace = remove
nl_after_semicolon = true
nl_after_brace_open = true
nl_after_brace_close = false
nl_func_leave_one_liners = false
nl_getset_leave_one_liners = true
nl_if_leave_one_liners = false
mod_sort_import = false
mod_sort_include = false
mod_full_paren_if_bool = false
mod_remove_extra_semicolon = false
indent_class = true
nl_split_for_one_liner = true
nl_split_while_one_liner = true
sp_angle_shift = ignore
sp_permit_cpp11_shift = true
indent_align_assign = false
indent_align_paren = false
indent_func_call_param = true
indent_func_def_param = true
indent_func_proto_param = true
nl_after_vbrace_open = true
nl_after_case = true
set WORD lock
nl_case_colon_brace = remove
# Preserve comment payloads and avoid the inherited profile's drifting padding
# before inline comments when a compact compound statement expands.
cmt_indent_multi = false
indent_relative_single_line_comments = true
